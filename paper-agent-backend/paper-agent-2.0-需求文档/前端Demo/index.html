<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>paper-agent · 科研智能体工作台（前端 Demo）</title>
<style>
  :root{
    --bg:#FFFFFF; --side:#FBFBFA; --surface:#FFFFFF; --surface2:#F7F7F5; --raised:#F1F1EF;
    --line:rgba(16,16,16,.09); --line2:rgba(16,16,16,.15);
    --ink:#1A1A1A; --ink2:#555552; --ink3:#9B9B96;
    --accent:#111111; --link:#2563EB; --link-soft:rgba(37,99,235,.08);
    --ok:#179A6B; --blue:#2563EB; --warn:#D97706; --fail:#DC2626;
    --ok-soft:rgba(23,154,107,.1); --warn-soft:rgba(217,119,6,.1); --fail-soft:rgba(220,38,38,.08);
    --r:10px; --r-sm:7px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SF Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow:hidden}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(16,16,16,.16);border-radius:8px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(16,16,16,.28);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  svg{display:block}
  .app{display:flex;height:100vh;overflow:hidden}

  /* ============ Sidebar ============ */
  .sidebar{width:248px;flex:0 0 248px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .brand{display:flex;align-items:center;gap:10px;padding:17px 16px 14px}
  .brand .mark{width:27px;height:27px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:#fff}
  .brand .t{font-weight:650;letter-spacing:.2px;font-size:14.5px}
  .brand .s{font-size:11px;color:var(--ink3);margin-top:-1px}
  .newtask{margin:4px 12px 14px;display:flex;align-items:center;justify-content:center;gap:8px;height:36px;border-radius:var(--r-sm);
    background:var(--ink);color:#fff;font-weight:560;font-size:13.5px;transition:.15s}
  .newtask:hover{background:#000}
  .side-sec{padding:6px 16px 4px;font-size:11px;color:var(--ink3);letter-spacing:.6px;text-transform:uppercase}
  .hist{flex:1;overflow-y:auto;padding:2px 8px}
  .hist-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;cursor:pointer;margin-bottom:1px;transition:.12s;border:1px solid transparent}
  .hist-item:hover{background:rgba(16,16,16,.045)}
  .hist-item.active{background:var(--raised)}
  .hist-item .ic{color:var(--ink3);flex:0 0 auto}
  .hist-item.active .ic{color:var(--ink)}
  .hist-item .ti{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .hist-item .d{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--ink3)}
  .conn-card{margin:10px 12px 14px;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;background:var(--surface)}
  .conn-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);position:relative;flex:0 0 auto}
  .pulse::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--ok);opacity:.4;animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.6);opacity:.55}100%{transform:scale(1.5);opacity:0}}
  .conn-sub{font-size:11px;color:var(--ink3);margin-top:6px;font-family:var(--mono)}
  .conn-sub b{color:var(--ink2);font-weight:500}

  /* ============ Main ============ */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:54px;flex:0 0 54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;background:#FFFFFF}
  .tb-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink2);background:var(--surface)}
  .badge .bd{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
  .badge.run{color:var(--blue);border-color:rgba(37,99,235,.3);background:var(--link-soft)} .badge.run .bd{background:var(--blue);animation:blink 1.1s infinite}
  .badge.done{color:var(--ok);border-color:rgba(23,154,107,.3);background:var(--ok-soft)} .badge.done .bd{background:var(--ok)}
  @keyframes blink{50%{opacity:.25}}
  .tb-spacer{flex:1}
  .tb-btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line);color:var(--ink2);font-size:12.5px;background:var(--surface);transition:.13s}
  .tb-btn:hover{background:var(--surface2);color:var(--ink)}

  .scroll{flex:1;overflow-y:auto}
  .inner{max-width:840px;margin:0 auto;padding:28px 28px 20px}

  /* welcome */
  .welcome{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .welcome .logo{width:50px;height:50px;border-radius:14px;background:var(--ink);display:grid;place-items:center;color:#fff;margin-bottom:22px}
  .welcome h1{font-size:26px;font-weight:680;letter-spacing:.2px}
  .welcome p{color:var(--ink3);margin-top:11px;font-size:13.5px;max-width:520px}
  .chips{display:flex;flex-direction:column;gap:10px;margin-top:30px;width:560px;max-width:92%}
  .chip{border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;font-size:12.5px;color:var(--ink2);text-align:left;transition:.14s;background:var(--surface)}
  .chip:hover{border-color:var(--line2);background:var(--surface2)}
  .chip .q{font-weight:600;color:var(--ink);display:block;margin-bottom:2px;font-size:13px}
  .chip .n{color:var(--ink3);font-size:11.5px}

  /* messages */
  .msg{margin:20px 0;animation:rise .28s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{display:flex;justify-content:flex-end}
  .msg.user .bub{max-width:80%;background:var(--surface2);border:1px solid var(--line);border-radius:12px 12px 4px 12px;padding:11px 14px;font-size:13.5px;color:var(--ink);white-space:pre-wrap}
  .msg.agent .who{display:flex;align-items:center;gap:8px;margin-bottom:11px;color:var(--ink2);font-size:12.5px;font-weight:600}
  .msg.agent .who .am{width:22px;height:22px;border-radius:6px;background:var(--ink);display:grid;place-items:center;color:#fff}
  .blocks>*+*{margin-top:12px}

  /* thinking */
  .think{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
  .think-h{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;user-select:none}
  .think-h .ic{color:var(--ink2)} .think-h .tx{font-size:12.5px;font-weight:600;color:var(--ink2)}
  .think-h .chev{margin-left:auto;color:var(--ink3);transition:.2s}
  .think.collapsed .chev{transform:rotate(-90deg)}
  .think-b{padding:2px 14px 12px 36px;color:var(--ink3);font-size:12.8px}
  .think.collapsed .think-b{display:none}
  .think-line{position:relative;padding-left:14px;margin-top:7px}
  .think-line::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
  .caret{display:inline-block;width:2px;height:14px;background:var(--ink2);vertical-align:-2px;margin-left:2px;animation:blink 1s infinite}

  /* plan */
  .plan{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:6px 14px 12px}
  .plan-h{display:flex;align-items:center;gap:9px;padding:8px 0 6px;font-size:12.5px;font-weight:600;color:var(--ink2)}
  .plan-h .ic{color:var(--ink)}
  .plan-item{display:flex;align-items:flex-start;gap:11px;padding:7px 0;font-size:13px;color:var(--ink3)}
  .plan-item .ck{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 auto;margin-top:2px;display:grid;place-items:center;transition:.18s}
  .plan-item.active{color:var(--ink)} .plan-item.active .ck{border-color:var(--blue);color:var(--blue)}
  .plan-item.done{color:var(--ink2)} .plan-item.done .ck{border-color:var(--ink);background:var(--ink);color:#fff}
  .spin{width:11px;height:11px;border:1.7px solid rgba(37,99,235,.25);border-top-color:var(--blue);border-radius:50%;animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* tool */
  .tool{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
  .tool-h{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;user-select:none}
  .tool-h .st{width:16px;height:16px;flex:0 0 auto;display:grid;place-items:center}
  .tool-h .st .spin{width:14px;height:14px;border-color:rgba(37,99,235,.25);border-top-color:var(--blue)}
  .tool-h .nm{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
  .tool-h .lb{font-size:11.5px;color:var(--ink3)}
  .tool-h .meta{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:11px;color:var(--ink3)}
  .tool-h .chev{color:var(--ink3);transition:.2s}
  .tool.open .chev{transform:rotate(180deg)}
  .tool-b{display:none;border-top:1px solid var(--line);padding:11px 13px 13px}
  .tool.open .tool-b{display:block}
  .kv-l{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3);margin:9px 0 4px}
  .kv-l:first-child{margin-top:0}
  .code{font-family:var(--mono);font-size:11.8px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:9px 11px;color:#3A3835;white-space:pre-wrap;word-break:break-word}
  .srcrow{display:flex;flex-wrap:wrap;gap:7px}
  .src{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink2);background:var(--surface)}
  .src .n{color:var(--ok)} .src.skip{color:var(--ink3)} .src.skip .n{color:var(--warn)}
  .outlist{font-size:12.3px;color:var(--ink2)}
  .outlist li{list-style:none;padding-left:16px;position:relative;margin:4px 0}
  .outlist li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
  .infonote{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-left:2.5px solid var(--ink3);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--ink2);background:var(--surface2)}
  .infonote .ic{color:var(--ink3);flex:0 0 auto;margin-top:1px}

  /* report */
  .report{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
  .report-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .report-h .ic{color:var(--ink)} .report-h .tx{font-weight:650;font-size:13.5px}
  .report-h .acts{margin-left:auto;display:flex;gap:7px}
  .rbtn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);color:var(--ink2);background:var(--surface);transition:.13s}
  .rbtn:hover{background:var(--surface2);color:var(--ink)}
  .report-b{padding:26px 26px 24px}
  .rt-title{font-size:21px;font-weight:700;line-height:1.4;letter-spacing:.2px}
  .rt-meta{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px}
  .abstract{margin:20px 0;padding:13px 16px;border-left:2.5px solid var(--ink);background:var(--surface2);border-radius:0 8px 8px 0;font-size:13px;color:var(--ink2)}
  .rsec{margin-top:24px}
  .rsec h3{font-size:14.5px;font-weight:650;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .rsec h3::before{content:"";width:3px;height:14px;background:var(--ink);border-radius:2px}
  .rsec p{font-size:13.3px;color:var(--ink2);margin:8px 0}
  table.cmp{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.2px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  table.cmp th{background:var(--surface2);text-align:left;padding:9px 11px;font-weight:620;color:var(--ink);font-size:11.8px;border-bottom:1px solid var(--line)}
  table.cmp td{padding:9px 11px;color:var(--ink2);border-bottom:1px solid var(--line);vertical-align:top}
  table.cmp tr:last-child td{border-bottom:none}
  .ref{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--link);border:1px solid rgba(37,99,235,.35);border-radius:5px;padding:0 5px;margin:0 1px;cursor:default;vertical-align:1px}
  .concl{counter-reset:c}
  .concl .concl-li{counter-increment:c;position:relative;padding:11px 0 11px 34px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
  .concl .concl-li:last-child{border-bottom:none}
  .concl .concl-li::before{content:counter(c);position:absolute;left:0;top:11px;width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;font-size:11.5px;font-weight:700}
  .tagfact{display:inline-flex;align-items:center;font-size:10px;font-family:var(--mono);padding:1px 7px;border-radius:5px;margin-left:7px;border:1px solid rgba(23,154,107,.4);color:var(--ok);vertical-align:1px}
  .refs{padding-left:4px;counter-reset:r}
  .refs .ref-li{counter-increment:r;position:relative;padding:8px 0 8px 32px;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line)}
  .refs .ref-li:last-child{border-bottom:none}
  .refs .ref-li::before{content:"["counter(r)"]";position:absolute;left:0;color:var(--ink3);font-family:var(--mono);font-size:11px;top:9px}
  .ph-note{font-size:11px;color:var(--ink3);font-style:italic;margin-top:10px}
  .verdict{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(23,154,107,.3);border-left:2.5px solid var(--ok);border-radius:8px;padding:12px 14px;background:var(--ok-soft);margin-top:18px;font-size:12.3px;color:var(--ink2)}
  .verdict .ic{color:var(--ok);flex:0 0 auto;margin-top:1px}
  .verdict b{color:var(--ink);font-weight:620}

  /* composer */
  .composer-wrap{flex:0 0 auto;padding:10px 28px 14px;border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.95) 30%)}
  .composer{max-width:840px;margin:0 auto;border:1px solid var(--line2);border-radius:14px;background:var(--surface);transition:.15s}
  .composer:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(16,16,16,.06)}
  .composer textarea{width:100%;resize:none;background:none;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:13.5px;line-height:1.6;padding:13px 15px 4px;max-height:200px}
  .composer textarea::placeholder{color:var(--ink3)}
  .comp-b{display:flex;align-items:center;gap:8px;padding:7px 10px 9px}
  .cbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);transition:.13s}
  .cbtn:hover{background:var(--surface2);color:var(--ink)}
  .send{margin-left:auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--raised);color:var(--ink3);transition:.15s}
  .send.ready{background:var(--ink);color:#fff}
  .send.ready:hover{background:#000}
  .comp-hint{max-width:840px;margin:7px auto 0;text-align:center;font-size:11px;color:var(--ink3)}

  /* toast */
  .toasts{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:9px;z-index:99}
  .toast{display:flex;align-items:flex-start;gap:9px;background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:10px 13px;font-size:12.5px;color:var(--ink);min-width:240px;max-width:340px;animation:rise .25s ease;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  .toast .ic{margin-top:1px;flex:0 0 auto}
  .toast.info .ic{color:var(--blue)} .toast.ok .ic{color:var(--ok)} .toast.warn .ic{color:var(--warn)}
  @media (max-width:900px){.sidebar{display:none}.inner,.composer,.comp-hint{max-width:100%}}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>
      </div>
      <div><div class="t">paper-agent</div><div class="s">Research Agent · on AGH</div></div>
    </div>
    <button class="newtask" id="newTaskBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建科研任务
    </button>
    <div class="side-sec">今天</div>
    <div class="hist" id="hist">
      <div class="hist-item active" data-id="cur">
        <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>
        <span class="ti" id="histTitle">固态电解质界面阻抗表征方法综述</span>
        <span class="d" id="histDot"></span>
      </div>
      <div class="hist-item">
        <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>
        <span class="ti">钙钛矿光伏缺陷钝化机制调研</span><span class="d"></span>
      </div>
      <div class="hist-item">
        <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>
        <span class="ti">锂金属负极枝晶抑制方法对比</span><span class="d"></span>
      </div>
    </div>
    <div class="conn-card">
      <div class="conn-row"><span class="pulse"></span>AGH 已连接 · 会话实时记录</div>
      <div class="conn-sub">session <b id="sessId">sess-8f3a2c</b><br/>model <b>Agnes · Flash</b></div>
    </div>
  </aside>

  <!-- Main -->
  <section class="main">
    <div class="topbar">
      <div class="tb-title" id="tbTitle">科研智能体工作台</div>
      <span class="badge" id="statusBadge"><span class="bd"></span><span id="statusText">待开始</span></span>
      <div class="tb-spacer"></div>
      <button class="tb-btn" id="speedBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5 4 14h7l-1 5 9-9h-7z"/></svg>
        <span id="speedText">快进</span>
      </button>
      <button class="tb-btn" id="restartBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        重新演示
      </button>
    </div>

    <div class="scroll" id="scroll">
      <div class="inner" id="inner">
        <div class="welcome" id="welcome">
          <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.5 1 2.5h6c0-1 .4-1.9 1-2.5A6 6 0 0 0 12 3z"/></svg>

固态电解质的高阻抗界面主要来自电极/电解质界面与晶界两类。本文基于近五年文献，按原理归纳六类表征方法，建立"原理—可测界面—优势—局限"对比矩阵，并给出方法选择与组合验证建议。

## 1. 表征方法对比
| 方法 | 原理 | 可测界面 | 优势 | 局限 |
|---|---|---|---|---|
| EIS + 等效电路 | 频域小信号，Nyquist 弧段 | 电极/晶界 | 无损、可定量、可原位 | 拟合多解 |

          <tr><td>EIS + 等效电路 / DRT</td><td>频域小信号，Nyquist 弧段对应不同界面</td><td>电极 / 晶界</td><td>无损、可定量、可原位</td><td>拟合多解，需物理约束</td><td><span class="ref">1</span><span class="ref">2</span></td></tr>
          <tr><td>变温 / 工况 EIS</td><td>Arrhenius 关系提取活化能，分离体相与晶界</td><td>晶界 / 体相</td><td>可分离晶界贡献</td><td>装置复杂、耗时</td><td><span class="ref">3</span></td></tr>
          <tr><td>(S)TEM（含原位偏压）</td><td>纳米尺度界面形貌与元素分布</td><td>电极 / 晶界</td><td>直观、高分辨</td><td>制样损伤、真空差异</td><td><span class="ref">4</span></td></tr>
          <tr><td>XPS / 原位 XPS</td><td>界面化学态、空间电荷层</td><td>电极界面化学</td><td>化学信息明确</td><td>难以测量离子动力学</td><td><span class="ref">5</span></td></tr>
          <tr><td>FIB-SEM 三维成像</td><td>界面三维结构与接触</td><td>接触 / 孔隙</td><td>三维定量</td><td>分辨率与视野权衡</td><td><span class="ref">6</span></td></tr>
        </tbody>
      </table>
    </div>

    <div class="rsec"><h3>三、关键争议与数据一致性</h3>
      <p>晶界活化能在不同体系中报道为约 0.4–0.9 eV，存在明显分歧；本文按 as-reported 标注，不做跨体系直接比较。</p>
    </div>

    <div class="rsec"><h3>四、研究缺口与趋势</h3>
      <p>原位/工况、跨尺度多手段联合标定，以及基于 DRT/机器学习的可复现拟合，是当前主要发展方向。</p>
    </div>

    <div class="rsec"><h3>五、结论</h3>
      <div class="concl">
        <div class="concl-li">EIS 是基础且不可替代的定量手段，须以物理约束等效电路或 DRT 降低多解性。<span class="ref">1</span><span class="ref">2</span><span class="ref">3</span><span class="tagfact">fact</span></div>
        <div class="concl-li">晶界与电极界面阻抗的可靠分离依赖变温 EIS 与显微/化学手段交叉验证，单一方法不足。<span class="ref">3</span><span class="ref">4</span><span class="ref">5</span><span class="tagfact">fact</span></div>
        <div class="concl-li">原位与三维成像为高置信趋势，但制样与环境差异是主要误差源。<span class="ref">4</span><span class="ref">6</span><span class="tagfact">fact</span></div>
        <div class="concl-li">当前主要缺口是跨尺度、多手段联合标定与自动化、可复现的分析流程。<span class="ref">3</span><span class="ref">6</span><span class="tagfact">fact</span></div>
      </div>
    </div>

  /* ---------- follow-up ---------- */
  async function follow(text){
    addUser(text);
    await sleep(300);
    const blocks=addTurn();
    const th=addThinking(blocks);
    await th.line("用户在报告基础上追问，先判断是否需要新增检索或仅整合已有证据。");
    th.finish();
    const t=addTool(blocks,"sciret_analyze","补充分析");
    t.open(); t.input(JSON.stringify({followup:text,scope:"existing session"},null,2));
    t.outputHTML('<ul class="outlist"><li>在同一会话内保持证据编号连续</li></ul>');
    await sleep(1100); await t.done();
    blocks.appendChild(el("div","rsec",'<h3>补充回复（Demo）</h3><p>已记录你的追问。真实运行时会在<b>同一会话</b>补充检索/分析，并把新增结论与证据并入上方报告（编号连续、可溯源）。你可以继续要求“把第三节展开”或“补充 2026 年最新文献”。</p>'));
    scrollBottom();
    log("followup",text);
  }

  /* ---------- composer ---------- */
  function autoGrow(){ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,200)+"px"; }
  ta.addEventListener("input",()=>{ autoGrow(); sendBtn.classList.toggle("ready",ta.value.trim().length>0); });
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); submit(); } });
  sendBtn.onclick=submit;
  function submit(){
    const v=ta.value.trim(); if(!v)return;
    ta.value=""; autoGrow(); sendBtn.classList.remove("ready");
    if(!started){ $("welcome").remove(); $("tbTitle").textContent=v.length>26?v.slice(0,26)+"…":v; $("histTitle").textContent=v.length>18?v.slice(0,18)+"…":v; scenario(v); }
    else if(done){ follow(v); }
    else { toast("任务执行中，请等待当前流程完成","warn"); ta.value=v; autoGrow(); }
  }

  /* restart */
  $("restartBtn").onclick=()=>{
    started=false; done=false; fast=false; trace=[]; setStatus("");
    inner.innerHTML='<div class="welcome" id="welcome"><div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.5 1 2.5h6c0-1 .4-1.9 1-2.5A6 6 0 0 0 12 3z"/></svg></div><h1>提出科研问题，交付完整研究成果</h1><p>底座为 Agnes Harness：系统将深入思考、拆解任务、调用检索与分析工具、交叉验证，最终产出一份结论可溯源的科研报告。</p><div class="chips" id="chips"></div></div>';
    renderChips();
    $("tbTitle").textContent="科研智能体工作台"; $("histTitle").textContent="固态电解质界面阻抗表征方法综述";
  };

  /* speed */
  $("speedBtn").onclick=()=>{ fast=!fast; $("speedText").textContent=fast?"正常速度":"快进"; toast(fast?"已快进，流程将快速完成":"已恢复正常速度", fast?"ok":"info"); };

  /* new task */
  $("newTaskBtn").onclick=()=>{ $("restartBtn").click(); ta.focus(); };

})();
